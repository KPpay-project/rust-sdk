[package]
name = "kppay"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Async Rust SDK for the KPPAY Gateway REST API"
repository = "https://github.com/kppay/kppay"
rust-version = "1.85"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
